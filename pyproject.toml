[project]
name = "protokoll"
version = "0.1.0"
description = "Gör Jönköpings kommuns nämndprotokoll sökbara: PDF -> markdown -> sökindex -> MCP-server"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "pymupdf4llm",
    "mcp[cli]",
    "python-docx",
]

[project.scripts]
protokoll = "protokoll.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protokoll"]
