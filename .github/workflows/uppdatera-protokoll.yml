# Hämtar nya protokoll, konverterar och indexerar — och committar resultatet.
# Körs schemalagt (nämnden sammanträder ca en gång i månaden) och manuellt.
name: Uppdatera protokoll

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 3" # onsdagar 05:17 UTC

permissions:
  contents: write

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Kör pipeline
        run: |
          uv venv .venv
          uv pip install -p .venv/bin/python -e .
          .venv/bin/protokoll all
      - name: Committa nya protokoll
        run: |
          git config user.name "protokoll-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Inga nya protokoll."
          else
            git commit -m "Uppdatera protokoll $(date -u +%F)"
            git push
          fi
